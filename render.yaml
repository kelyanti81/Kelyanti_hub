services:
  - type: web
    name: kelyanti-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: HUB_USERNAME
        sync: false
      - key: HUB_PASSWORD
        sync: false
