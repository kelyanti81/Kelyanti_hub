<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>{% block title %}Kelyanti Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">K</span><span>KELYANTI <small>HUB</small></span></a>
      <div class="nav-label">ESPACE PRINCIPAL</div>
      <nav>
        <a class="{{ 'active' if active == 'dashboard' else '' }}" href="{{ url_for('section', page='dashboard') }}"><span>⌂</span> Tableau de bord</a>
        <a class="{{ 'active' if active == 'minecraft' else '' }}" href="{{ url_for('section', page='minecraft') }}"><span>▦</span> Minecraft</a>
        <a class="{{ 'active' if active == 'arduino' else '' }}" href="{{ url_for('section', page='arduino') }}"><span>⌁</span> Arduino</a>
      </nav>
      <div class="nav-label lower-label">PRÉFÉRENCES</div>
      <nav>
        <a class="{{ 'active' if active == 'settings' else '' }}" href="{{ url_for('section', page='settings') }}"><span>⚙</span> Paramètres</a>
        <a class="{{ 'active' if active == 'account' else '' }}" href="{{ url_for('section', page='account') }}"><span>◉</span> Mon compte</a>
      </nav>
      <div class="sidebar-bottom"><span class="online-dot"></span> Espace personnel</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">Kelyanti Hub <span>/</span> {{ title }}</div><div class="user-chip"><span class="avatar">K</span><span>{{ session.get('username', 'Utilisateur') }}</span></div></header>
      <section class="content">{% block content %}{% endblock %}</section>
      <footer>© 2026 Kelyanti Hub <span>•</span> Ton espace numérique</footer>
    </main>
  </div>
</body>
</html>
