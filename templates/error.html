{% extends "base.html" %}

{% block title %}Erreur {{ code }} - Kelyanti Hub{% endblock %}

{% block content %}
<div class="error-page">
    <span class="eyebrow">ERREUR</span>
    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn-primary">Retour au tableau de bord</a>
</div>
{% endblock %}
