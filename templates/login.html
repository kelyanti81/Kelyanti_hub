{% extends "base.html" %}

{% block title %}Connexion - Kelyanti Hub{% endblock %}

{% block public_content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">K</div>
        <span class="eyebrow">BIENVENUE SUR</span>
        <h1>Kelyanti <span>Hub</span></h1>
        <p class="login-description">Connecte-toi pour accéder à ton espace personnel.</p>

        <form method="POST" action="{{ url_for('login') }}" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Identifiant</label>
            <input id="username" name="username" type="text"
                   placeholder="Ton identifiant" autocomplete="username" required>

            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password"
                   placeholder="Ton mot de passe" autocomplete="current-password" required>

            <button type="submit" class="btn-primary login-submit">
                Se connecter
            </button>
        </form>

        <p class="login-footer">Les comptes sont créés par l'administrateur.</p>
    </div>
</div>
{% endblock %}
