
{% extends "base.html" %}

{% block title %}Connexion · Kelyanti Hub{% endblock %}

{% block login_content %}
<div class="login-card">
    <div class="brand-icon login-logo">K</div>
    <span class="eyebrow">BIENVENUE</span>
    <h1>Kelyanti Hub</h1>
    <p>Connecte-toi à ton espace personnel.</p>

    {% if error %}
        <div class="notice error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="form-stack">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

        <label for="username">Identifiant</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="btn-primary" type="submit">Se connecter</button>
    </form>
</div>
{% endblock %}
